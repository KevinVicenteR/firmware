[platformio]
default_envs = atlas_usbasp

[env:atlas_usbasp]
platform = atmelavr@5.3.0
board = nanoatmega328new
framework = arduino
upload_protocol = usbasp
; -e: borrar el chip antes de escribir (sin esto la verificación falla).
; -B 4: SCK más lento para una programación ISP estable.
upload_flags =
    -Pusb
    -e
    -B
    4
; Consola del firmware ATLAS.
monitor_speed = 115200
; Solo adaptadores USB-serie (evita abrir puertos Bluetooth).
monitor_port = /dev/cu.*usb*
; No reiniciar el robot al abrir el monitor (la telemetria sigue en EEPROM de todos modos).
monitor_dtr = 0
monitor_rts = 0
; Consola de comandos: ver lo que se escribe y enviar LF al pulsar Enter.
monitor_echo = yes
monitor_eol = LF
